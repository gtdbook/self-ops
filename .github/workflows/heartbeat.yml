name: heartbeat

# 每日晨间自检 + 自愈看门狗：五项健康检查（流水线/数据/部署/周报/进化）+ issue 告警闭环；
# 流水线漏跑或进化环停摆时自动 workflow_dispatch 补触发
on:
  schedule:
    - cron: "30 22 * * *" # UTC 22:30 = 北京时间 06:30
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  actions: write # 漏跑自愈：允许补触发 pipeline / evolve

jobs:
  check:
    name: 每日自检
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行自检
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/heartbeat.py
