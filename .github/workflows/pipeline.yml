name: pipeline

# 自动抓取 → 自动处理 → 自动提交 → 自动部署 Pages
on:
  schedule:
    - cron: "0 * * * *" # 每小时整点（UTC）
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-process:
    name: 抓取与处理
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取数据源
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch.py

      - name: 生成日报与索引
        run: python scripts/process.py

      - name: 提交数据变更
        run: |
          git config user.name "self-ops-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "本轮无数据变更，跳过提交"
          else
            git commit -m "data: 自动抓取与处理 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: 失败即时告警
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/alert.py

  deploy-pages:
    name: 部署 Pages
    needs: fetch-process
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 取回上一步刚推送的最新数据

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建静态站点
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
