name: pipeline

# 自动抓取 → 自动处理 → 自动提交 → 自动部署 Pages
on:
  schedule:
    - cron: "0 * * * *" # 每小时整点（UTC）
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write # 失败即时告警需要开/评论 issue
  pages: write
  id-token: write

jobs:
  fetch-process:
    name: 抓取与处理
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取数据源
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch.py

      - name: 生成日报与索引
        run: python scripts/process.py

      - name: 提交数据变更
        run: |
          git config user.name "self-ops-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "本轮无数据变更，跳过提交"
          else
            git commit -m "data: 自动抓取与处理 $(date -u '+%Y-%m-%d %H:%M') UTC"
            # pipeline / heartbeat / evolve / weekly / sediment 都会推 main，
            # 撞车时 rebase 远端新提交再重试；裸重试只会再撞同一次失败
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "[retry $i] push 被拒（并发提交竞争），rebase 后重试"
              git pull --rebase --autostash origin main
              sleep $((i * 8))
            done
            echo "push 重试 3 次仍失败"
            exit 1
          fi

      - name: 失败即时告警
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/alert.py

  deploy-pages:
    name: 部署 Pages
    needs: fetch-process
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 取回上一步刚推送的最新数据

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建静态站点
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 等待 artifact 索引生效
        run: sleep 15 # 规避 artifact API 一致性延迟导致的 "No artifacts named github-pages"

      # deploy-pages 偶发 "Fetching artifact metadata failed"（GitHub API 瞬时抖动），
      # 最多重试两次；任一次成功即结束
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
